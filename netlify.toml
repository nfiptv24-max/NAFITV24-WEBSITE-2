# Netlify Configuration for NAFI TV 24
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Stream Proxy endpoint redirect to Netlify Function
[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200
  force = true

# Single Page Application (SPA) redirect rule
# Ensures all routes redirect to index.html without 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & CORS Headers for streaming compatibility
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

# Cache optimization for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
